[package]
name = "tiny_luma"
version = "1.0.0"
edition = "2024"
description = "Post-processing for AI images — a lightweight native desktop editor built with egui."
license = "AGPL-3.0-or-later"
repository = "https://github.com/ThetaCursed/TinyLuma"
authors = ["ThetaCursed"]
readme = "README.md"
keywords = ["image-editor", "ai", "stable-diffusion", "egui", "lut"]
categories = ["graphics", "multimedia::images"]

[[bin]]
name = "TinyLuma"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
eframe = "0.28"
egui = "0.28"
egui-phosphor = "0.6.0"
image = "0.25"
webp = "0.3"
rayon = "1.10"
rfd = "0.14"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
png = "0.18"
resvg = { version = "0.48.1", default-features = false }

[build-dependencies]
winresource = "0.1.31"